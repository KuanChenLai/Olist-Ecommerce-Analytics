<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Olist 電商數據分析儀表板總覽</title>
  <desc id="desc">顯示總營收、訂單、客戶、回購率、月營收趨勢與商品類別營收排行。</desc>
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <text x="48" y="60" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="30" font-weight="700" fill="#17324D">Olist 電商數據分析｜經營總覽</text>
  <text x="48" y="88" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">已交付訂單｜2016–2018｜Python × SQLite × Power BI</text>

  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif">
    <g transform="translate(48 118)"><rect width="270" height="110" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/><text x="22" y="32" font-size="14" fill="#64748B">總營收</text><text x="22" y="77" font-size="30" font-weight="700" fill="#17324D">R$13.22M</text></g>
    <g transform="translate(352 118)"><rect width="270" height="110" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/><text x="22" y="32" font-size="14" fill="#64748B">已交付訂單</text><text x="22" y="77" font-size="30" font-weight="700" fill="#17324D">96,478</text></g>
    <g transform="translate(656 118)"><rect width="270" height="110" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/><text x="22" y="32" font-size="14" fill="#64748B">有效客戶</text><text x="22" y="77" font-size="30" font-weight="700" fill="#17324D">93,358</text></g>
    <g transform="translate(960 118)"><rect width="270" height="110" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/><text x="22" y="32" font-size="14" fill="#64748B">回購率</text><text x="22" y="77" font-size="30" font-weight="700" fill="#17324D">3.00%</text></g>

    <g transform="translate(48 260)">
      <rect width="745" height="405" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/>
      <text x="24" y="38" font-size="17" font-weight="700" fill="#17324D">月營收趨勢</text>
      <line x1="68" y1="340" x2="710" y2="340" stroke="#D9E2EC"/>
      <line x1="68" y1="250" x2="710" y2="250" stroke="#E8EDF2"/>
      <line x1="68" y1="160" x2="710" y2="160" stroke="#E8EDF2"/>
      <line x1="68" y1="70" x2="710" y2="70" stroke="#E8EDF2"/>
      <text x="10" y="345" font-size="12" fill="#64748B">0</text><text x="7" y="255" font-size="12" fill="#64748B">0.3M</text><text x="7" y="165" font-size="12" fill="#64748B">0.7M</text><text x="7" y="75" font-size="12" fill="#64748B">1.0M</text>
      <polyline points="68,337 96,326 124,305 152,271 180,250 208,242 236,228 264,209 292,190 320,169 348,154 376,132 404,101 432,126 460,84 488,112 516,78 544,71 572,76 600,105 628,98 656,104 684,112 710,119" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="404" cy="101" r="6" fill="#F2C94C" stroke="#17324D" stroke-width="2"/>
      <text x="368" y="87" font-size="12" font-weight="700" fill="#17324D">2017-11 高峰</text>
      <text x="68" y="370" font-size="12" fill="#64748B">2016-09</text><text x="363" y="370" font-size="12" fill="#64748B">2017-11</text><text x="655" y="370" font-size="12" fill="#64748B">2018-08</text>
    </g>

    <g transform="translate(825 260)">
      <rect width="405" height="405" rx="12" fill="#FFFFFF" stroke="#D9E2EC"/>
      <text x="24" y="38" font-size="17" font-weight="700" fill="#17324D">商品類別營收排行</text>
      <g font-size="12" fill="#1F2937">
        <text x="24" y="84">美妝與健康</text><rect x="140" y="68" width="225" height="22" rx="4" fill="#2F80ED"/>
        <text x="24" y="126">鐘錶禮品</text><rect x="140" y="110" width="213" height="22" rx="4" fill="#2F80ED"/>
        <text x="24" y="168">家居寢具</text><rect x="140" y="152" width="187" height="22" rx="4" fill="#14B8A6"/>
        <text x="24" y="210">運動休閒</text><rect x="140" y="194" width="174" height="22" rx="4" fill="#14B8A6"/>
        <text x="24" y="252">電腦配件</text><rect x="140" y="236" width="162" height="22" rx="4" fill="#F2C94C"/>
        <text x="24" y="294">家具裝飾</text><rect x="140" y="278" width="130" height="22" rx="4" fill="#F2C94C"/>
      </g>
      <text x="24" y="348" font-size="14" font-weight="700" fill="#17324D">前十大類別貢獻 62.43% 營收</text>
      <text x="24" y="375" font-size="12" fill="#64748B">最高類別：美妝與健康 R$1.23M</text>
    </g>
  </g>
</svg>
